$kind: http-request
name: Update Booking Status
method: PATCH
url: '{{baseUrl}}/admin/bookings/:id/status'
order: 2000
auth:
  type: bearer
  credentials:
    - key: token
      value: '{{accessToken}}'
pathVariables:
  - key: id
    value: '{{bookingId}}'
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "status": "CONFIRMED",
      "reason": "Payment verified"
    }
