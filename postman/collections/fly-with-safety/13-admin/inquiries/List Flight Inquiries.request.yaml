$kind: http-request
name: List Flight Inquiries
method: GET
url: '{{baseUrl}}/admin/inquiries/flights?page=1&limit=20&status=PENDING'
order: 1000
auth:
  type: bearer
  credentials:
    - key: token
      value: '{{accessToken}}'
queryParams:
  - key: page
    value: '1'
  - key: limit
    value: '20'
  - key: status
    value: PENDING
