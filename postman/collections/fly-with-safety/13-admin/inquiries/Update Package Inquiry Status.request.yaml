$kind: http-request
name: Update Package Inquiry Status
method: PATCH
url: '{{baseUrl}}/admin/inquiries/packages/:id/status'
order: 6000
auth:
  type: bearer
  credentials:
    - key: token
      value: '{{accessToken}}'
pathVariables:
  - key: id
    value: '{{inquiryId}}'
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "status": "CONFIRMED",
      "note": "Confirmed by agent"
    }
