$kind: http-request
name: Update Testimonial Status
method: PATCH
url: '{{baseUrl}}/admin/testimonials/:id/status'
order: 3000
auth:
  type: bearer
  credentials:
    - key: token
      value: '{{accessToken}}'
pathVariables:
  - key: id
    value: '{{testimonialId}}'
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "status": "APPROVED"
    }
