$kind: http-request
name: Submit Visa Inquiry
method: POST
url: '{{baseUrl}}/visa/inquiries'
order: 3000
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "destination": "UAE",
      "nationality": "Bangladeshi",
      "travelPurpose": "Tourism",
      "name": "John Doe",
      "email": "john@example.com",
      "phone": "+8801700000000",
      "notes": "Need tourist visa for 30 days"
    }
