$kind: http-request
name: Update Profile
method: PATCH
url: '{{baseUrl}}/account/profile'
order: 6000
auth:
  type: bearer
  credentials:
    - key: token
      value: '{{accessToken}}'
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "name": "John Updated"
    }
